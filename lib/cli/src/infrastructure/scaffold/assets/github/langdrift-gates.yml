# Generated by `dft init` from @langdrift/cli {{version}}. The team owns this workflow
# from here on and may edit it; dft never rewrites it.
#
# LangDrift CI Gates reports each pull request's commit range in the job
# summary. Its FinOps readings stay unknown: .langdrift/ never reaches CI.
name: LangDrift CI Gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: langdrift-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: LangDrift - CI Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the report can read the pull request's range.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes @langdrift/cli@{{version}} gates report
