			<feGaussianBlur in="edge" stdDeviation="0.8" result="edge-soft" />
			<feFlood flood-color="#ecebf0" />
			<feComposite in2="edge-soft" operator="in" result="rim-light" />
			<feOffset in="SourceAlpha" dx="-3" dy="-2" result="lifted" />
