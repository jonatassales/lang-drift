			<feFlood flood-color="#c9c9d6" flood-opacity="0.32" />
			<feComposite in2="halo-blur" operator="in" result="halo" />
			<feMerge>
				<feMergeNode in="halo" />
				<feMergeNode in="SourceGraphic" />
				<feMergeNode in="rim-light" />
			</feMerge>
		</filter>
		<filter id="eye-glow" x="-50%" y="-80%" width="200%" height="260%">
			<feGaussianBlur stdDeviation="3" />
		</filter>
	</defs>

