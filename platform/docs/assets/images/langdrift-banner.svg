<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
	<title id="title">LangDrift — Agentic FinOps Platform</title>
	<desc id="description">The LangDrift mark and wordmark over the headline Agentic FinOps Platform, with Platform in the rainbow gradient, beside a terminal showing a real ex agent plan session.</desc>
	<defs>
		<clipPath id="frame">
			<rect width="1280" height="640" rx="28"/>
		</clipPath>
		<radialGradient id="purple-glow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#6D0AD6" stop-opacity="0.55"/>
			<stop offset="0.55" stop-color="#6D0AD6" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#6D0AD6" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="peach-glow" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#F97316" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#F97316" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="rainbow" x1="80" y1="0" x2="352" y2="0" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#F43F5E"/>
			<stop offset="0.2" stop-color="#F97316"/>
			<stop offset="0.4" stop-color="#FACC15"/>
			<stop offset="0.6" stop-color="#22C55E"/>
			<stop offset="0.8" stop-color="#3B82F6"/>
			<stop offset="1" stop-color="#8C3BEF"/>
		</linearGradient>
		<linearGradient id="card-edge" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
		</linearGradient>
		<linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#0B0B0C" stop-opacity="0"/>
			<stop offset="1" stop-color="#0B0B0C" stop-opacity="0.7"/>
		</linearGradient>
	</defs>

	<g clip-path="url(#frame)">
		<rect width="1280" height="640" fill="#0B0B0C"/>
		<ellipse cx="930" cy="300" rx="520" ry="420" fill="url(#purple-glow)"/>
		<ellipse cx="170" cy="640" rx="420" ry="260" fill="url(#peach-glow)"/>

		<!-- The drift mark, large and faint: a ring with one segment carried outward. -->
		<g transform="translate(610 -10) scale(10.5)" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2.2" stroke-linecap="round">
			<path d="M45.54 49.34A22 22 0 1 1 45.54 14.66"/>
			<path d="M56.72 18.86A28 28 0 0 1 56.72 45.14"/>
		</g>

		<rect y="440" width="1280" height="200" fill="url(#vignette)"/>

		<!-- Mark and wordmark -->
		<g transform="translate(80 78)">
			<svg width="40" height="40" viewBox="0 0 64 64" fill="none" stroke="#F5F5F5" stroke-width="9" stroke-linecap="round">
				<path d="M45.54 49.34A22 22 0 1 1 45.54 14.66"/>
				<path d="M56.72 18.86A28 28 0 0 1 56.72 45.14"/>
			</svg>
			<text x="54" y="30" fill="#F5F5F5" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="650" letter-spacing="-1.6">LangDrift</text>
		</g>

		<!-- Headline -->
		<g font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="600" letter-spacing="-3.4">
			<text x="76" y="262" fill="#F5F5F5" font-size="80">Agentic FinOps</text>
			<text x="76" y="350" fill="url(#rainbow)" font-size="80">Platform</text>
		</g>

		<g font-family="SF Pro Text, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" fill="#A1A1AA" letter-spacing="-0.2">
			<text x="80" y="418">One team envelope. Every paid call</text>
			<text x="80" y="450">reserved before it runs.</text>
		</g>

		<!-- Product line -->
		<g font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="14" letter-spacing="0.6">
			<rect x="80" y="520" width="98" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
			<text x="129" y="542" fill="#E4E4E7" text-anchor="middle">FinOps</text>
			<rect x="190" y="520" width="152" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
			<text x="266" y="542" fill="#E4E4E7" text-anchor="middle">Microruntimes</text>
			<rect x="354" y="520" width="92" height="34" rx="17" fill="#6D0AD6" fill-opacity="0.32" stroke="#8C3BEF" stroke-opacity="0.7"/>
			<text x="400" y="542" fill="#F5F5F5" text-anchor="middle">ex CLI</text>
		</g>

		<!-- Terminal: lines from a real `ex agent plan` session, trimmed to fit -->
		<g transform="translate(652 118)">
			<rect width="568" height="414" rx="16" fill="#151517" fill-opacity="0.94"/>
			<rect x="0.5" y="0.5" width="567" height="413" rx="15.5" fill="none" stroke="url(#card-edge)"/>
			<path d="M0 16A16 16 0 0 1 16 0H552A16 16 0 0 1 568 16V44H0Z" fill="#FFFFFF" fill-opacity="0.035"/>
			<line x1="0" y1="44" x2="568" y2="44" stroke="#2A2A2D"/>
			<circle cx="24" cy="22" r="6" fill="#3F3F46"/>
			<circle cx="44" cy="22" r="6" fill="#3F3F46"/>
			<circle cx="64" cy="22" r="6" fill="#3F3F46"/>
			<text x="284" y="27" fill="#71717A" font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="12.5" text-anchor="middle">ex — project</text>

			<g font-family="SF Mono, ui-monospace, Menlo, monospace" font-size="13">
				<text x="24" y="78"><tspan fill="#8C3BEF">$</tspan><tspan fill="#F5F5F5"> ex agent plan 0070-console-microruntime.ticket.md</tspan></text>
				<text x="24" y="104" fill="#71717A"># plan only · nothing is built or started</text>
				<text x="24" y="130"><tspan fill="#A1A1AA">agent ›</tspan><tspan fill="#D4D4D8"> tool call: read 0070-console-microruntime.ticket.md</tspan></text>
				<text x="24" y="156"><tspan fill="#4ADE80">✓</tspan><tspan fill="#D4D4D8"> read&#160;&#160;&#160;&#160;&#160;&#160;&#160;7 documents · nothing outside the ticket's links</tspan></text>
				<text x="24" y="182" fill="#D4D4D8">bounded&#160;&#160;&#160;&#160;cpuMillis 2000 · memoryMiB 3072 · set by owner</text>
				<text x="24" y="208" fill="#D4D4D8">budget&#160;&#160;&#160;&#160;&#160;$25.00 per run for model calls</text>
				<text x="24" y="234"><tspan fill="#A1A1AA">agent ›</tspan><tspan fill="#D4D4D8"> vector search · project episodes · top 6</tspan></text>
				<text x="24" y="260"><tspan fill="#4ADE80">✓</tspan><tspan fill="#D4D4D8"> suggests&#160;&#160;&#160;claude-sonnet-5-5 · effort medium</tspan></text>
				<text x="24" y="286"><tspan fill="#4ADE80">✓</tspan><tspan fill="#D4D4D8"> size&#160;&#160;&#160;&#160;&#160;&#160;&#160;500m of 2000m · 1024 of 3072 MiB</tspan></text>
				<text x="24" y="312"><tspan fill="#4ADE80">✓</tspan><tspan fill="#D4D4D8"> plan&#160;&#160;&#160;&#160;&#160;&#160;&#160;runtime.md draft, revision 1 · proposed</tspan></text>
				<text x="24" y="338" fill="#71717A"># next: once the team authorizes, ex agent run</text>
				<text x="24" y="376"><tspan fill="#8C3BEF">$</tspan><tspan fill="#F5F5F5"> ex agent run console-microruntime</tspan></text>
			</g>
			<rect x="309" y="363" width="8" height="17" rx="1" fill="#F5F5F5" fill-opacity="0.85"/>
		</g>
	</g>
</svg>
