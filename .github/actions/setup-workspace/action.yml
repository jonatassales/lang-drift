name: Set up workspace
description: Install pnpm and Node.js, then the workspace dependencies from the lockfile.

runs:
  using: composite
  steps:
    # pnpm's version comes from devEngines.packageManager in package.json.
    # Node.js 24 is the floor that engines.node accepts.
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@24
        cache: true
        require-lockfile: true
    # Go builds and tests the LangDrift CLI, its contracts and console-stubs through the same
    # Turborepo tasks; go.work at the root ties their modules together.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.work
        cache-dependency-path: |
          lib/cli/go.sum
          apps/microservices/console-stubs/go.sum
          go.work.sum
    # drift quality reads the tree through ripgrep, which the runner image
    # lacks; the release archive is checked against its published SHA-256.
    - name: ripgrep
      shell: sh
      env:
        RIPGREP_VERSION: 15.2.0
        RIPGREP_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
      run: |
        archive="ripgrep-$RIPGREP_VERSION-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/BurntSushi/ripgrep/releases/download/$RIPGREP_VERSION/$archive"
        printf '%s  %s\n' "$RIPGREP_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
        printf '%s\n' "$RUNNER_TEMP/${archive%.tar.gz}" >>"$GITHUB_PATH"
