name: Set up workspace
description: Install pnpm and Node.js, then the workspace dependencies from the lockfile.

runs:
  using: composite
  steps:
    # pnpm's version comes from devEngines.packageManager in package.json.
    # Node.js 24 is the floor that engines.node accepts.
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: node@24
        cache: true
        require-lockfile: true
    # Go builds and tests the ex CLI, its contracts and extub through the same
    # Turborepo tasks; go.work at the root ties their modules together.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.work
        cache-dependency-path: |
          packages/ex/go.sum
          apps/extub/go.sum
          go.work.sum
