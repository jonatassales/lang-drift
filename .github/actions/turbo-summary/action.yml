name: Turborepo summary
description: >-
  Write the job's Turborepo run summaries into the job summary and upload them
  as turbo-summary-<name>, which telemetry.yml ships to Better Stack.

inputs:
  name:
    description: The job's key, which names the artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Job summary
      shell: sh
      run: platform/cli/drift ci summary .turbo/runs/*.json >>"$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: turbo-summary-${{ inputs.name }}
        path: .turbo/runs/*.json
        retention-days: 14
        if-no-files-found: ignore
