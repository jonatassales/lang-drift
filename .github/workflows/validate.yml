# Validates the workspace at one commit: build, check, test and security.
# pull-request.yml and main.yml call it; it never runs by itself.
name: Validate

on:
  workflow_call:

permissions:
  contents: read

env:
  # The Git hooks are for local commits; CI runs the same guardrails.
  HUSKY: '0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm turbo run build

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Format, lint and imports (Biome)
        run: pnpm turbo run check
      - name: Types
        run: pnpm turbo run typecheck
      - name: Biome configuration
        run: platform/cli/drift check biome
      - name: Localization
        run: platform/cli/drift check localization
      - name: Dead code
        run: platform/cli/drift quality dead-code
      - name: Repository rules
        run: platform/cli/drift quality check

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - run: pnpm turbo run test

  security:
    name: Security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      # Fails on a known high or critical advisory in a production dependency.
      - name: npm advisories
        run: pnpm audit --prod --audit-level=high
      # Fails when our code reaches a known vulnerable function, through a
      # module or the standard library of the toolchain go.work pins.
      - name: Go vulnerabilities
        run: |
          for module in apps/extub packages/ex packages/contracts; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 ./...) # v1.9.0
          done
