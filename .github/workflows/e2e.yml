# Runs the ex CLI's e2e-tagged suite against a real kind cluster. It is slow
# and infrastructure-bound, so it runs on demand and weekly, never on pull
# requests.
name: Ex end-to-end

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Lifecycle against kind
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/ex/go.mod
          cache-dependency-path: packages/ex/go.sum
      # Docker and kubectl come with the runner image; kind and terraform are
      # pinned by checksum so an image update cannot change what we test with.
      - name: Install kind 0.33.0
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum -c -
          install -m 755 kind /usr/local/bin/kind && rm kind
      - name: Install terraform 1.17.0
        run: |
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.17.0/terraform_1.17.0_linux_amd64.zip
          echo 'c168cab7c637a8769fdb90089ddd19de701bc6ff8aca64dc2e2185fe46f59f67  terraform.zip' | sha256sum -c -
          unzip -o terraform.zip terraform
          install -m 755 terraform /usr/local/bin/terraform && rm terraform terraform.zip
      - name: Run the e2e suite
        working-directory: packages/ex
        run: GOTOOLCHAIN=local go test -tags e2e -count=1 -timeout 40m ./src
