# Ships every Pull request and Main run to Better Stack as NDJSON events: the
# run, its jobs, their steps and each Turborepo task (drift ci record).
#
# workflow_run runs main's copy of this file with main's code, so the token
# never meets a pull request's code. A fork's run reaches it only as what the
# GitHub API reports and as turbo summaries that jq parses; nothing from the
# triggering run is executed.
name: Telemetry

on:
  workflow_run:
    workflows: [Pull request, Main]
    types: [completed]
  # Ships a run again, for a backfill or after the source token changes.
  workflow_dispatch:
    inputs:
      run-id:
        description: The id of the run to ship
        required: true
        type: number
      run-attempt:
        description: Its attempt
        required: true
        type: number
        default: 1

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: Report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Holds the Better Stack secret and only deploys from main.
    environment: telemetry
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run-id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.run-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run record
        run: platform/cli/drift ci record "$RUN_ID" "$RUN_ATTEMPT" >ci-run.ndjson
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-run-${{ env.RUN_ID }}-${{ env.RUN_ATTEMPT }}
          path: ci-run.ndjson
          retention-days: 90
          if-no-files-found: error
      - name: Ship to Better Stack
        env:
          BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
          BETTERSTACK_INGESTING_HOST: ${{ vars.BETTERSTACK_INGESTING_HOST }}
        run: platform/cli/drift ci ship ci-run.ndjson
