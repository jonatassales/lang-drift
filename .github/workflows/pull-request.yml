# Validates a pull request into main: validate.yml, then the guardrails that
# only a pull request has, its commit range and the workflows it may change.
name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The Git hooks are for local commits; CI runs the same guardrails below.
  HUSKY: '0'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  guardrails:
    name: Harness - Guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of the pull request, not only the merge result.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: platform/cli/drift git lint-history "$BASE_SHA" "$HEAD_SHA"
      - name: Workflows
        run: platform/cli/drift check workflows

  harness-score:
    name: Harness - Score
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Harness rules audit
        run: platform/cli/drift quality coverage >>"$GITHUB_STEP_SUMMARY"
