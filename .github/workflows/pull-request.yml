# Validates a pull request into main: validate.yml, then the guardrails that
# only a pull request has, its commit range and the workflows it may change.
name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The Git hooks are for local commits; CI runs the same guardrails below.
  HUSKY: '0'

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  guardrails:
    name: Harness - Guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit of the pull request, not only the merge result.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: packages/drift/drift git lint-history "$BASE_SHA" "$HEAD_SHA"
      - name: Workflows
        run: packages/drift/drift check workflows

  harness-score:
    name: Harness - Score
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Harness rules audit
        run: packages/drift/drift quality coverage >>"$GITHUB_STEP_SUMMARY"

  delivery-intelligence:
    name: Delivery - Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [guardrails]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Publish delivery widgets
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WIDGET_SHA: ${{ github.event.pull_request.head.sha }}
          WIDGET_PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: packages/drift/drift widget dashboard --publish >>"$GITHUB_STEP_SUMMARY"
