packages:
  - apps/*
  - exphere/*
  - packages/*

engineStrict: true

# Prebuilt binaries ship as optional dependencies, so these never run their
# install scripts.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false

# orbo-voice is the owner's own package, and 1.1.2 is a day-old release the
# policy would otherwise reject. Remove this entry once it is older than
# minimumReleaseAge (after 2026-10-26 17:10 UTC).
minimumReleaseAgeExclude:
  - orbo-voice@1.1.2

# Nextra 4.6.1 relies on Zod 4.1's optional custom-value parsing for its layout
# props; newer Zod rejects the docs theme's omitted children field.
overrides:
  "nextra@4.6.1>zod": 4.1.12
  "nextra-theme-docs@4.6.1>zod": 4.1.12
