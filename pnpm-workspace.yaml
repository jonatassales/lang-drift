packages:
  - apps/*
  - packages/*

engineStrict: true

# Prebuilt binaries ship as optional dependencies, so these never run their
# install scripts.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false

# orbo-voice is the owner's own package, and 1.1.2 is a day-old release the
# policy would otherwise reject. Remove this entry once it is older than
# minimumReleaseAge (after 2026-10-26 17:10 UTC).
minimumReleaseAgeExclude:
  - orbo-voice@1.1.2
